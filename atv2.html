<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rádio Maré | Links</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
    /* Disco de vinil girando (CSS puro) */
    .vinil {
      background:
        radial-gradient(circle, #ffd1dc 0 9%, #1a1a1a 10% 14%, transparent 15%),
        repeating-radial-gradient(circle, #111 0 3px, #222 3px 6px);
      animation: girar 8s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    .link-btn { transition: transform .15s ease, background-color .15s ease; }
    .link-btn:hover { transform: translateX(6px); background-color: #fff; }
    @media (prefers-reduced-motion: reduce) { .vinil { animation: none; } .link-btn { transition: none; } }
  </style>
</head>
<body class="min-h-screen bg-[#1d2bff] text-[#ffe9ef] flex justify-center px-5 py-12">

  <main class="w-full max-w-md">
    <!-- Perfil -->
    <header class="flex flex-col items-center text-center">
      <div class="vinil w-32 h-32 rounded-full shadow-2xl ring-4 ring-[#ffd1dc]" role="img" aria-label="Disco de vinil girando"></div>
      <h1 class="mt-6 text-4xl font-extrabold tracking-tight">Rádio Maré</h1>
      <p class="mt-2 text-lg text-[#ffd1dc]">Música independente, bate-papo e playlists feitas por estudantes.</p>
    </header>

    <!-- Links -->
    <nav class="mt-10 flex flex-col gap-4" aria-label="Meus links">
      <a href="https://open.spotify.com" target="_blank" rel="noopener"
         class="link-btn block rounded-full bg-[#ffd1dc] text-[#1d2bff] font-semibold px-6 py-4 text-center focus:outline-none focus-visible:ring-4 focus-visible:ring-white">
        Ouvir a playlist da semana
      </a>
      <a href="https://www.youtube.com" target="_blank" rel="noopener"
         class="link-btn block rounded-full bg-[#ffd1dc] text-[#1d2bff] font-semibold px-6 py-4 text-center focus:outline-none focus-visible:ring-4 focus-visible:ring-white">
        Assistir aos episódios no YouTube
      </a>
      <a href="https://www.instagram.com" target="_blank" rel="noopener"
         class="link-btn block rounded-full bg-[#ffd1dc] text-[#1d2bff] font-semibold px-6 py-4 text-center focus:outline-none focus-visible:ring-4 focus-visible:ring-white">
        Seguir no Instagram
      </a>
      <a href="https://www.tiktok.com" target="_blank" rel="noopener"
         class="link-btn block rounded-full bg-[#ffd1dc] text-[#1d2bff] font-semibold px-6 py-4 text-center focus:outline-none focus-visible:ring-4 focus-visible:ring-white">
        Ver os bastidores no TikTok
      </a>
      <a href="mailto:contato@radiomare.com"
         class="link-btn block rounded-full border-2 border-[#ffd1dc] text-[#ffd1dc] font-semibold px-6 py-4 text-center hover:text-[#1d2bff] focus:outline-none focus-visible:ring-4 focus-visible:ring-white">
        Sugerir uma música
      </a>
    </nav>

    <footer class="mt-12 text-center text-sm text-[#ffd1dc]/80">
      Feito com HTML e Tailwind CSS
    </footer>
  </main>

</body>
</html>
